title: JoeyDDong Blog
subtitle: 记录代码、学习与生活。
description: 编程笔记、学习记录，以及值得留下来的思考。
author: JoeyDDong
language: en
timezone: Asia/Tokyo
url: https://blog.joeyddong.top
root: /
permalink: posts/:slug/
permalink_defaults: {}
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - assets/**
new_post_name: :title.md
default_layout: post
auto_spacing: false
titlecase: false
external_link:
  enable: false
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: '  '
prismjs:
  enable: false
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
theme: joeyddong
markdown:
  render:
    html: false
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - name: markdown-it-texmath
      options:
        delimiters: dollars
        katexOptions:
          throwOnError: false
          strict: ignore
